<div class="search-panel">
  <label class="search-label">{{ label }}</label>

  <div class="input-shell">
    <p-dropdown
      [options]="options"
      optionLabel="label"
      optionValue="value"
      [placeholder]="placeholder"
      [(ngModel)]="value"
      (onChange)="onChange($event)"
      appendTo="self"
      class="search-input"
    >
    </p-dropdown>
  </div>
</div>
