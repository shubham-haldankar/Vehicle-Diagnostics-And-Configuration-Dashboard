<form
  [formGroup]="searchForm"
  (ngSubmit)="onSearch()"
  novalidate
  class="bg-[#111318] border border-white/[0.07]"
>
  <!-- Header -->
  <div class="flex items-center gap-2 px-4 py-3 border-b border-white/[0.07]">
    <app-button-icon
      type="search"
      size="sm"
      class="text-[#6b7280]"
    ></app-button-icon>
    <span
      class="text-[9px] tracking-[0.18em] uppercase text-[#6b7280] font-mono"
      >SEARCH LOGS</span
    >
  </div>

  <!-- Fields -->
  <div class="p-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-6 gap-3 items-start">
      <!-- Vehicle ID -->
      <div class="flex flex-col gap-1.5">
        <label
          for="vehicleId"
          class="text-[9px] tracking-[0.15em] uppercase text-[#6b7280] font-mono"
        >
          VEHICLE ID
        </label>
        <input
          id="vehicleId"
          formControlName="vehicleId"
          type="text"
          placeholder="1234"
          class="w-full px-3 py-2 bg-[#0c0d10] border border-white/[0.07] text-[#e8eaf0] focus:outline-none focus:border-amber-500/60 transition-colors text-[11px] font-mono"
          aria-label="Vehicle ID"
        />
        <p
          class="text-[9px] font-mono min-h-[14px]"
          [ngClass]="showVehicleIdError ? 'text-red-400' : 'text-transparent'"
          role="alert"
        >
          {{
            showVehicleIdError
              ? 'VEHICLE ID MUST BE EXACTLY 4 DIGITS.'
              : '\u00A0'
          }}
        </p>
      </div>

      <!-- Error Code -->
      <div class="flex flex-col gap-1.5">
        <label
          for="errorCode"
          class="text-[9px] tracking-[0.15em] uppercase text-[#6b7280] font-mono"
        >
          ERROR CODE
        </label>
        <input
          id="errorCode"
          formControlName="errorCode"
          type="text"
          placeholder="U0420, P0300…"
          class="w-full px-3 py-2 bg-[#0c0d10] border border-white/[0.07] text-[#e8eaf0] focus:outline-none focus:border-amber-500/60 transition-colors text-[11px] font-mono uppercase"
          aria-label="Error code"
        />
        <p
          class="text-[9px] font-mono min-h-[14px]"
          [ngClass]="showErrorCodeError ? 'text-red-400' : 'text-transparent'"
          role="alert"
        >
          {{
            showErrorCodeError
              ? 'USE FORMAT LIKE U0420 OR U0420, P0300.'
              : '\u00A0'
          }}
        </p>
      </div>

      <!-- From date -->
      <div class="flex flex-col gap-1.5">
        <label
          for="fromDate"
          class="text-[9px] tracking-[0.15em] uppercase text-[#6b7280] font-mono"
          >FROM</label
        >
        <input
          id="fromDate"
          formControlName="fromDate"
          type="date"
          [class.date-empty]="!searchForm.get('fromDate')?.value"
          class="w-full px-3 py-2 bg-[#0c0d10] border border-white/[0.07] text-[#e8eaf0] focus:outline-none focus:border-amber-500/60 transition-colors text-[11px] font-mono"
          aria-label="From date"
        />
        <p class="text-[9px] font-mono min-h-[14px] text-transparent">&nbsp;</p>
      </div>

      <!-- To date -->
      <div class="flex flex-col gap-1.5">
        <label
          for="toDate"
          class="text-[9px] tracking-[0.15em] uppercase text-[#6b7280] font-mono"
          >TO</label
        >
        <input
          id="toDate"
          formControlName="toDate"
          type="date"
          [class.date-empty]="!searchForm.get('toDate')?.value"
          class="w-full px-3 py-2 bg-[#0c0d10] border border-white/[0.07] text-[#e8eaf0] focus:outline-none focus:border-amber-500/60 transition-colors text-[11px] font-mono"
          aria-label="To date"
        />
        <p class="text-[9px] font-mono min-h-[14px] text-transparent">&nbsp;</p>
      </div>

      <!-- Severity -->
      <div class="flex flex-col gap-1.5">
        <label
          for="severity"
          class="text-[9px] tracking-[0.15em] uppercase text-[#6b7280] font-mono"
        >
          SEVERITY
        </label>
        <select
          id="severity"
          formControlName="severity"
          class="w-full px-3 py-2 bg-[#0c0d10] border border-white/[0.07] text-[#e8eaf0] focus:outline-none focus:border-amber-500/60 transition-colors text-[11px] font-mono appearance-none cursor-pointer"
          aria-label="Severity"
        >
          <option value="">All severities</option>
          <option value="ERROR">ERROR</option>
          <option value="WARN">WARN</option>
          <option value="INFO">INFO</option>
        </select>
        <p class="text-[9px] font-mono min-h-[14px] text-transparent">&nbsp;</p>
      </div>

      <!-- Actions -->
      <div class="flex flex-col gap-1.5">
        <span class="text-[9px] opacity-0 select-none" aria-hidden="true">-</span>
        <div class="flex gap-2">
          <button
            type="submit"
            [disabled]="hasSearchAttempted && searchForm.invalid"
            [attr.aria-disabled]="hasSearchAttempted && searchForm.invalid"
            [ngClass]="
              hasSearchAttempted && searchForm.invalid
                ? 'opacity-40 cursor-not-allowed'
                : 'hover:bg-amber-500/30'
            "
            class="flex-1 flex items-center justify-center gap-1.5 px-4 py-2 bg-amber-500/20 border border-amber-500/60 text-amber-400 transition-colors text-[9px] font-bold tracking-wider font-mono"
            aria-label="Search"
          >
            <app-button-icon type="search" size="sm"></app-button-icon>
            SEARCH
          </button>
          <button
            type="button"
            (click)="onClear()"
            class="flex-1 flex items-center justify-center gap-1.5 px-4 py-2 border border-white/[0.07] text-[#6b7280] hover:text-[#e8eaf0] hover:border-white/20 transition-colors text-[9px] font-mono"
            aria-label="Clear"
          >
            <app-button-icon type="close" size="sm"></app-button-icon>
            CLEAR
          </button>
        </div>
        <p class="text-[9px] font-mono min-h-[14px] text-transparent">&nbsp;</p>
      </div>
    </div>
  </div>
</form>
