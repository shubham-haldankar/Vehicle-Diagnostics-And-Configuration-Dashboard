<input #openToggle type="checkbox" class="sr-only" checked />

<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center p-4"
  [ngClass]="
    openToggle.checked
      ? 'modal-backdrop-enter'
      : 'modal-backdrop-leave pointer-events-none'
  "
  style="background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(6px)"
  (click)="
    $event.target === $event.currentTarget && (openToggle.checked = false)
  "
  (animationend)="
    $event.target === $event.currentTarget &&
      !openToggle.checked &&
      closed.emit()
  "
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'Log entry detail for ' + entry.code"
  cdkTrapFocus
>
  <!-- Modal panel -->
  <div
    #panel
    class="relative w-full max-w-2xl bg-[#111318] border border-white/10 flex flex-col"
    [ngClass]="openToggle.checked ? 'modal-panel-enter' : 'modal-panel-leave'"
    style="
      max-height: 90vh;
      box-shadow:
        0 0 0 1px rgba(245, 158, 11, 0.15),
        0 32px 64px rgba(0, 0, 0, 0.6);
    "
    (click)="$event.stopPropagation()"
  >
    <!-- Severity accent bar -->
    <div class="h-0.5 w-full" [ngClass]="severityBarClass()"></div>

    <!-- ── Header ── -->
    <div
      class="flex items-center justify-between px-6 py-4 border-b border-white/[0.07] shrink-0"
    >
      <div class="flex items-center gap-3">
        <!-- Severity icon box -->
        <div
          class="w-8 h-8 border flex items-center justify-center"
          [ngClass]="severityIconBoxClass()"
          *ngIf="['ERROR', 'WARN', 'INFO'].includes(entry.type)"
        >
          <svg
            *ngIf="entry.type === 'ERROR'"
            class="w-3.5 h-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <svg
            *ngIf="entry.type === 'WARN'"
            class="w-3.5 h-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"
            />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          <svg
            *ngIf="entry.type === 'INFO'"
            class="w-3.5 h-3.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12.01" y2="8" />
          </svg>
        </div>
        <div>
          <div
            class="text-[9px] tracking-[0.18em] uppercase text-[#6b7280] mb-0.5 font-mono"
          >
            LOG ENTRY DETAIL
          </div>
          <div
            class="text-sm font-bold text-[#e8eaf0]"
            style="font-family: &quot;Rajdhani&quot;, sans-serif"
          >
            {{ entry.code }} — VID:{{ entry.vehicleId }}
          </div>
        </div>
      </div>

      <button
        (click)="openToggle.checked = false"
        class="w-7 h-7 flex items-center justify-center border border-white/[0.07] text-[#6b7280] hover:text-[#e8eaf0] hover:border-white/20 transition-colors"
        aria-label="Close detail modal"
        #closeBtn
      >
        <svg
          class="w-3 h-3"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M18 6 6 18M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- ── Body (scrollable) ── -->
    <div class="overflow-y-auto flex-1 p-6 space-y-6">
      <!-- Meta grid -->
      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 gap-y-5">
        <div *ngFor="let m of metaItems()">
          <p
            class="text-[9px] tracking-[0.15em] uppercase text-[#6b7280]/60 mb-1 font-mono"
          >
            {{ m.label }}
          </p>
          <span class="text-xs font-mono" [ngClass]="m.cls">{{ m.value }}</span>
        </div>
      </div>

      <!-- Severity + timestamp strip -->
      <div
        class="flex items-center gap-4 px-4 py-3 border"
        [ngClass]="severityStripClass()"
      >
        <span
          class="inline-flex items-center gap-1 px-1.5 py-px border text-[10px] font-bold tracking-[0.1em] font-mono"
          [ngClass]="severityBadgeClass()"
        >
          <svg
            class="w-2.5 h-2.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            *ngIf="entry.type === 'ERROR'"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="8" x2="12" y2="12" />
            <line x1="12" y1="16" x2="12.01" y2="16" />
          </svg>
          <svg
            class="w-2.5 h-2.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            *ngIf="entry.type === 'WARN'"
          >
            <path
              d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"
            />
            <line x1="12" y1="9" x2="12" y2="13" />
            <line x1="12" y1="17" x2="12.01" y2="17" />
          </svg>
          <svg
            class="w-2.5 h-2.5"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            *ngIf="entry.type === 'INFO'"
          >
            <circle cx="12" cy="12" r="10" />
            <line x1="12" y1="16" x2="12" y2="12" />
            <line x1="12" y1="8" x2="12.01" y2="8" />
          </svg>
          {{ entry.type }}
        </span>
        <div class="flex-1 h-px bg-white/[0.06]"></div>
        <span class="text-[10px] text-[#6b7280] font-mono">{{
          entry.dateTimeCreated
        }}</span>
      </div>

      <!-- Description -->
      <div>
        <p
          class="text-[9px] tracking-[0.15em] uppercase text-[#6b7280]/60 mb-2 font-mono"
        >
          DESCRIPTION
        </p>
        <p
          class="text-[10px] text-amber-400/70 bg-black/40 border border-white/[0.06] px-4 py-3 overflow-x-auto leading-relaxed font-mono whitespace-pre"
        >
          {{ entry.message }}
        </p>
      </div>
    </div>

    <!-- ── Footer ── -->
    <div
      class="border-t border-white/[0.07] px-6 py-3 flex items-center justify-between bg-black/20 shrink-0"
    >
      <span class="text-[9px] text-[#6b7280]/40 font-mono truncate mr-4"
        >ID: {{ entry.id }}</span
      >
      <button
        (click)="openToggle.checked = false"
        class="px-4 py-1.5 text-[9px] font-mono border border-white/[0.07] text-[#6b7280] hover:text-[#e8eaf0] hover:border-white/20 transition-colors shrink-0"
      >
        CLOSE
      </button>
    </div>
  </div>
</div>
