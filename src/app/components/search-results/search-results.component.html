<h3>Search Results</h3>

<table class="table table-striped table-bordered" *ngIf="logs">
    <thead>
      <tr>
        <th>Sr No.</th>
        <th>Vehicle ID</th>
        <th>Date Time Created</th>
        <th>Log Type</th>
        <th>Code</th>
        <th>Message</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let log of logs; let i=index">
        <td>{{ i+1 }}</td>
        <td>{{ log.vehicleId }}</td>
        <td>{{ log.dateTimeCreated  | date:'short'}}</td>
        <td>{{ log.type }}</td>
        <td>{{ log.code }}</td>
        <td>{{ log.message }}</td>
      </tr>
    </tbody>
  </table>
